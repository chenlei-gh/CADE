name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    env:
      TEMP: D:\tmp
      TMP: D:\tmp
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create clean temp directory
        shell: bash
        run: |
          mkdir -p D:/tmp

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Prepare environment config stub
        shell: bash
        run: |
          python -c "from pathlib import Path; p = Path('.agents/skills/catia-caa-dev/config/caa_env_config.txt'); p.parent.mkdir(parents=True, exist_ok=True); p.write_text('CATIA_INSTALL=C:\\Program Files\\Dassault Systemes\\B28\nCATIA_VERSION=B28\nCAA_INSTALL=C:\\Program Files\\Dassault Systemes\\B28\nWORKSPACE=C:\\temp\\workspace\n', encoding='utf-8') if not p.exists() else None"

      - name: Run Static Audit
        shell: bash
        run: |
          export PYTHONIOENCODING=utf-8
          export PYTHONUTF8=1
          python scripts/static_audit.py

      - name: Run CADE Core Test Suites
        shell: bash
        run: |
          export PYTHONIOENCODING=utf-8
          export PYTHONUTF8=1
          python -c "
          import subprocess, sys
          suites = [
              '.agents/skills/catia-caa-dev/tests/test_full_integration.py',
              '.agents/skills/catia-caa-dev/tests/test_icons.py',
              '.agents/skills/catia-caa-dev/tests/test_phase2_intents.py',
              '.agents/skills/catia-caa-dev/tests/test_l4_architecture.py',
              '.agents/skills/catia-caa-dev/tests/test_l5_semantic.py',
              '.agents/skills/catia-caa-dev/tests/test_l6_fault_injection.py',
              '.agents/skills/catia-caa-dev/tests/test_intent_gate.py',
          ]
          failed = 0
          for s in suites:
              print(f'==> Running {s}')
              res = subprocess.run([sys.executable, s])
              if res.returncode != 0:
                  print(f'FAIL {s}', file=sys.stderr)
                  failed += 1
          if failed:
              sys.exit(1)
          print('\n>>> ALL CORE SUITES PASSED <<<')
          "
