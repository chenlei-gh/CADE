name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Prepare environment config stub
        shell: bash
        run: |
          python -c "from pathlib import Path; p = Path('.agents/skills/catia-caa-dev/config/caa_env_config.txt'); p.parent.mkdir(parents=True, exist_ok=True); p.write_text('CATIA_INSTALL=C:\\Program Files\\Dassault Systemes\\B28\nCATIA_VERSION=B28\nCAA_INSTALL=C:\\Program Files\\Dassault Systemes\\B28\nWORKSPACE=C:\\temp\\workspace\n', encoding='utf-8') if not p.exists() else None"

      - name: Run Static Audit
        shell: bash
        run: |
          python -c "import subprocess, sys, os; env = os.environ.copy(); env['PYTHONIOENCODING'] = 'utf-8'; env['PYTHONUTF8'] = '1'; res = subprocess.run([sys.executable, 'scripts/static_audit.py'], capture_output=True, text=True, env=env); print(res.stdout); print(res.stderr, file=sys.stderr); [print('::error title=Audit Error::' + line) for line in (res.stdout + res.stderr).splitlines() if '[FAIL]' in line or 'FAIL ' in line or 'Traceback' in line or 'Error:' in line][:10]; sys.exit(res.returncode)"

      - name: Run CADE Test Suite (Quick Mode)
        shell: bash
        run: |
          python -c "import subprocess, sys, os; env = os.environ.copy(); env['PYTHONIOENCODING'] = 'utf-8'; env['PYTHONUTF8'] = '1'; res = subprocess.run([sys.executable, '.agents/skills/catia-caa-dev/tests/test_master.py', '--quick'], capture_output=True, text=True, env=env); print(res.stdout); print(res.stderr, file=sys.stderr); [print('::error title=Test Error::' + line) for line in (res.stdout + res.stderr).splitlines() if 'FAIL' in line or 'Traceback' in line or 'Error:' in line][:10]; sys.exit(res.returncode)"
